name: Native ACP artifact
on:
  pull_request:
    paths:
      - 'crates/buzz-acp/**'
      - 'Cargo.lock'
      - '.github/workflows/native-acp-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Headless Linux ACP
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: native-acp-linux
      - name: Test and build the native harness
        run: |
          cargo test --locked -j 2 -p buzz-acp --lib
          cargo build --locked --release -j 2 -p buzz-acp
          mkdir -p native-acp-artifact
          cp target/release/buzz-acp native-acp-artifact/
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('native-acp-artifact')
          binary = root / 'buzz-acp'
          manifest = {
              'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
              'platform': 'ubuntu-22.04-x86_64',
              'command': 'cargo build --locked --release -j 2 -p buzz-acp',
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-acp-linux
          path: native-acp-artifact/
          if-no-files-found: error
          retention-days: 14
